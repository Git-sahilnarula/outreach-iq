name: Outreach IQ CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Testing & Schema Verification
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test Suite (Pytest & Alembic)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary==2.9.9

      - name: Run Pytest test suite
        working-directory: ./backend
        run: |
          python -m pytest tests/ -v --color=yes

  # ----------------------------------------------------------------------------
  # Job 2: Frontend TypeScript & Vite Production Build
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Verification (TypeScript & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Verify TypeScript & Build bundle
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build-verification:
    name: Docker Images Build Verification
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: outreach-iq-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: outreach-iq-frontend:test
