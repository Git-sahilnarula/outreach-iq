version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — Production Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: outreach-iq-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-outreach_iq}
      POSTGRES_USER: ${POSTGRES_USER:-outreach_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPasswordSecurelyInProduction123!}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach_user} -d ${POSTGRES_DB:-outreach_iq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach-iq-backend-prod
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-outreach_user}:${POSTGRES_PASSWORD:-ChangeThisPasswordSecurelyInProduction123!}@postgres:5432/${POSTGRES_DB:-outreach_iq}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MATCH_THRESHOLD=${MATCH_THRESHOLD:-75}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://yourdomain.com}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ----------------------------------------------------------------------------
  # Frontend & Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outreach-iq-frontend-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Local Ollama AI Engine
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: outreach-iq-ollama-prod
    restart: always
    volumes:
      - ollama-models:/root/.ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: outreach_iq_postgres_prod_data
  ollama-models:
    name: outreach_iq_ollama_prod_models
